<!doctype html>
<!-- Phone layout of 知回: the same app and data as the web version (/), with an icon tab bar at the bottom.
     data-layout="mobile" switches app.js to the phone layout; mobile.css holds the phone styles. -->
<html lang="zh-CN" data-layout="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="知回">
  <title>知回 · KnowBack</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/m/mobile.css">
</head>
<body>
  <!-- Loading screen: plain HTML + CSS so it shows before the app code arrives; app.js removes it once the
       sign-in check is done. The squirrel runs, rolls a pine cone, hops a knowledge card and catches a falling cone. -->
  <div id="splash" class="splash" role="status" aria-label="加载中 · Loading">
    <div class="splash-stage" aria-hidden="true">
      <div class="splash-ground"></div>
      <div class="splash-card"><i></i></div>
      <div class="splash-drop"><svg viewBox="0 0 24 24"><use href="#splash-pine"/></svg></div>
      <div class="splash-shadow"></div>
      <div class="splash-runner"><img src="/illustrations/mascot-walk.webp" alt="" decoding="async"></div>
      <div class="splash-cone"><svg viewBox="0 0 24 24"><use href="#splash-pine"/></svg></div>
      <div class="splash-spark">✦</div>
    </div>
    <div class="splash-dots" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#splash-pine"/></svg><svg viewBox="0 0 24 24"><use href="#splash-pine"/></svg><svg viewBox="0 0 24 24"><use href="#splash-pine"/></svg></div>
    <p class="splash-slow"></p>
    <svg width="0" height="0" class="splash-defs" aria-hidden="true"><defs><g id="splash-pine"><path d="M12 3.2c.5 1 1.7 1.6 2.6 1.4-.3.9-1.2 1.6-2.1 1.7h-1c-.9-.1-1.8-.8-2.1-1.7.9.2 2.1-.4 2.6-1.4Z" fill="#4f8a5b"/><path d="M12 6.4c3.4 0 5.6 3.2 5.6 7 0 4.2-2.6 7.4-5.6 7.4s-5.6-3.2-5.6-7.4c0-3.8 2.2-7 5.6-7Z" fill="#b8733d" stroke="#6b3f1f" stroke-width="1.2"/><path d="M7.6 11.2c1.4 1 3 1.4 4.4 1.4s3-.4 4.4-1.4M6.9 14.6c1.6 1.1 3.3 1.6 5.1 1.6s3.5-.5 5.1-1.6M8.1 18c1.2.8 2.5 1.2 3.9 1.2s2.7-.4 3.9-1.2M12 6.6v13.9" fill="none" stroke="#6b3f1f" stroke-width=".9" stroke-linecap="round" opacity=".75"/></g></defs></svg>
  </div>
  <script src="/splash.js"></script>
  <div id="app"></div>
  <noscript>请启用 JavaScript。Please enable JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
