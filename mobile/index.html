<!doctype html>
<!-- Phone layout of 知回: the same app and data as the web version (/), with an icon tab bar at the bottom.
     data-layout="mobile" switches app.js to the phone layout; mobile.css holds the phone styles. -->
<html lang="zh-CN" data-layout="mobile">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="知回">
  <title>知回 · KnowBack</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/m/mobile.css">
</head>
<body>
  <div id="app"></div>
  <noscript>请启用 JavaScript。Please enable JavaScript.</noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
