# Render Blueprint for a free public test deployment (see docs/DEPLOY_RENDER.md).
# Secrets are entered in the Render dashboard (sync: false); none are stored in this file.
services:
  - type: web
    name: zhihui
    runtime: node
    plan: free
    buildCommand: echo "No build step"
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ZHIPU_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_LOGIN_EMAIL
        sync: false
      # Review reminders by push (see docs/DEPLOY_RENDER.md): VAPID key pair, contact, and the pg_cron tick secret.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: PUSH_SECRET
        sync: false
